name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep the Gradle daemon inside the runner and fail fast on a stalled build.
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g"

jobs:
  build:
    name: Assemble and unit test
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Fetch the model pack from LFS
        # checkout@v4 runs `git lfs fetch` against a shallow ref, which can
        # leave the pointer in place. Fetch the object explicitly so the build
        # never sees a 134-byte pointer.
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs fetch --include="PocketTTS-english-FP32.zip" origin main
          git lfs checkout PocketTTS-english-FP32.zip
          size=$(stat -c%s PocketTTS-english-FP32.zip)
          echo "Model pack: $size bytes"
          if [ "$size" -lt 1000000 ]; then
            echo "::error::The model pack is still an LFS pointer."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The runner image already ships cmdline-tools. Accept the licences
      # before any action tries to use sdkmanager, otherwise setup-android
      # fails on the "tools" package it looks for.
      - name: Accept Android SDK licences
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || echo "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --list_installed 2>/dev/null | head -20 || true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
          cmdline-tools-version: '11076708'

      - name: Install SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || echo "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"
          "$SDKMANAGER" --list_installed

      - name: Fetch ONNX Runtime native dependencies
        run: bash scripts/prepare_android_native_deps.sh

      - name: Verify model pack
        run: |
          set -euo pipefail
          # The model pack is a Git LFS object. A pointer file must never
          # reach the build.
          size=$(stat -c%s PocketTTS-english-FP32.zip)
          echo "Model pack present: $size bytes."
          if [ "$size" -lt 1000000 ]; then
            echo "::error::PocketTTS-english-FP32.zip was not fetched from LFS."
            exit 1
          fi

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Assemble release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pocket-tts-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/**
            app/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
